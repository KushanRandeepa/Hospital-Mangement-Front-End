<p>payment-processes-manager works!</p>


<div class="relative overflow-x-auto shadow-md sm:rounded-lg mt-10">
    <table class="w-full text-sm text-left rtl:text-right">
        <thead class="text-xs text-white uppercase bg-blue-700 border-b border-blue-600 dark:text-white">
            <tr>
                <th scope="col" class="px-6 py-3">
                    Appointment ID
                </th>
                <th scope="col" class="px-6 py-3">
                    Patient ID
                </th>
                <th scope="col" class="px-6 py-3">
                    Type
                </th>
                <th scope="col" class="px-6 py-3">
                    Date
                </th>
                <th scope="col" class="px-6 py-3">
                    Price
                </th>
                <th scope="col" class="px-6 py-3">
                    Payment Status
                </th>
                  <th scope="col" class="px-6 py-3">
                </th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let appointment of appointments" class="bg-blue-100 border-b border-blue-400 hover:bg-blue-50  text-black font-bold">
                <th class="px-6 py-4">
                    {{appointment.id}}
                </th>
                <td class="px-6 py-4">
                    {{appointment.patientId}}
                </td>
                <td class="px-6 py-4">
                    {{appointment.type}}
                </td>
                <td class="px-6 py-4">
                    {{appointment.appointmentDate}}
                </td>
                <td class="px-6 py-4">
                    {{price}}
                </td>
                <td class="px-6 py-4">
                    {{appointment.paymentStatus}}
                </td>
                <td class="px-6 py-4">
                    <button type="submit" (click)="payNow(appointment.id)"
                        class="inline-flex justify-center items-center py-3 px-5 text-base font-medium text-center text-white rounded-lg bg-red-600 hover:bg-red-700 focus:ring-4 focus:ring-red-300 dark:focus:ring-red-800">
                        Pay Now</button>
                </td>
            </tr>

        </tbody>
    </table>
</div>
